"context.modules" = [
{ name = libpipewire-module-filter-chain
    args = {
        node.name        = "effect.rnnoise"
        node.description = "Filtered Q2U"
        media.name       = "Filtered Q2U"
        filter.graph = {
        nodes = [
        { type = ladspa
          name = rnnoise
          plugin = "rnnoise_ladspa"
          label  = "nt-filter"
          control = {
              "VAD %%" = 0
          }
        }
        { type = lv2
          name = compress
          plugin = "http://lsp-plug.in/plugins/lv2/compressor_mono"
          control = {
	    al = 0.004 # threshhold
	    at = 12    # attack time
            kn = 0.25  # knee
            rt = 250   # release time
            cr = 4     # ratio
            mk = 4     # makeup gain
	  }
	} ]
	links   = [ { output = "rnnoise:Output" input = "compress:in" } ]
        inputs  = [ "rnnoise:Input" "rnnoise:Input" ]
        outputs = [ "compress:out"  "compress:out"  ]
      }
      audio.channels = 2
      audio.position = [ FL FR ]
      capture.props = {
        node.passive = true
        node.target  = "alsa_input.usb-Samson_Technologies_Samson_Q2U_Microphone-00.analog-stereo"
      }
      playback.props = {
          media.class = Audio/Source
      }
    }
}]
