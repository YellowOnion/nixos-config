"context.modules" = [
{ name = libpipewire-module-filter-chain
    args = {
        node.name        = "effect.rnnoise"
        node.description = "Filtered Q2U"
        media.name       = "Filtered Q2U"
        filter.graph = {
        nodes = [
	{ type = builtin
	  name = mixer
	  label = mixer
	  control = { "Gain 1" = 1.0 "Gain 2" = 1.0 }
	}
#        { type = ladspa
#          name = rnnoise
#          plugin = "rnnoise_ladspa"
#          label  = "nt-filter"
#          control = {
#              "VAD %%" = 1.0
#          }
#        }
	{ type = builtin
	  name = hp
	  label = bq_highpass
	  control = { "Freq" = 50 }
	}
        { type = lv2
          name = compress
          plugin = "http://lsp-plug.in/plugins/lv2/compressor_mono"
          control = {
	    al = 0.125 # threshhold
	    at = 20.0   # attack time
            kn = 0.25  # knee
            rt = 250.0   # release time
	    hold = 50.0  
            cr = 4.0     # ratio
            mk = 4.0     # makeup gain
	  }
	}
	{ type = builtin
	  name = copyL
	  label = copy
	}
	{ type = builtin
	  name = copyR
	  label = copy
	}
	]
	links   = [
	{ output = "mixer:Out"      input = "hp:In" }
#	{ output = "rnnoise:Output" input = "hp:In" }
	{ output = "hp:Out"         input = "compress:in" }
	{ output = "compress:out"   input = "copyL:In"  }
	{ output = "compress:out"   input = "copyR:In"  }
	]
        inputs  = [ "mixer:In 1" "mixer:In 2" ]
        outputs = [ "copyL:Out"  "copyR:Out"  ]
      }
      audio.channels = 2
      audio.position = [ FL FR ]
      capture.props = {
        node.passive = true
        node.target  = "alsa_input.usb-Samson_Technologies_Samson_Q2U_Microphone-00.analog-stereo"
      }
      playback.props = {
          media.class = Audio/Source
      }
    }
}]
